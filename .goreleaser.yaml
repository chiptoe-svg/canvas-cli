# GoReleaser configuration for Canvas CLI
# Documentation: https://goreleaser.com

version: 2

project_name: canvas-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: canvas
    main: ./cmd/canvas
    binary: canvas
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

# Keyless signing of the checksums file (Sigstore/Fulcio/Rekor). Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp 'https://github.com/chiptoe-svg/canvas-cli.*' \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^feat'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^fix'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^perf'
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: chiptoe-svg
    name: canvas-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## Canvas CLI v{{.Version}}

    ### Installation

    **Quick install (macOS/Linux)**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/jjuanrivvera/canvas-cli/main/install.sh | sh
    ```

    **Homebrew (macOS/Linux)**
    ```bash
    brew tap jjuanrivvera/canvas-cli
    brew install canvas-cli
    ```

    **Go**
    ```bash
    go install github.com/jjuanrivvera/canvas-cli/cmd/canvas@v{{.Version}}
    ```

    **Binary Download**
    Download the appropriate archive for your platform below.

  # Ship a pinned copy of the install script with every release, alongside the
  # always-current one on main (raw.githubusercontent.com/.../main/install.sh).
  extra_files:
    - glob: ./install.sh

# homebrew_casks (not the deprecated `brews`): casks are the modern GoReleaser path for a
# pre-built binary and match the rest of the fleet. NOTE: this switches the tap artifact from a
# Formula to a Cask — delete the stale Formula/canvas-cli.rb from homebrew-canvas-cli after the
# first cask release, or brew sees a formula+cask name collision.
