# GoReleaser configuration for Canvas CLI
# Documentation: https://goreleaser.com

version: 2

project_name: canvas-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: canvas
    main: ./cmd/canvas
    binary: canvas
    env:
      - CGO_ENABLED=0
    # Reproducible builds: no build-path embedding, and the build date is the
    # commit date rather than the wall clock, so anyone can rebuild the tag
    # with the same Go toolchain and get a byte-identical binary.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # macOS and Linux only: the installer and the README cover those two, and
    # no CI job builds or tests Windows.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.CommitDate}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

# Keyless signing of the checksums file (Sigstore/Fulcio/Rekor). The signer
# identity is THIS repository's release workflow at the tagged ref. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/chiptoe-svg/canvas-cli/\.github/workflows/release\.yml@refs/tags/v' \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^feat'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^fix'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^perf'
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: chiptoe-svg
    name: canvas-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    **Install or update (macOS/Linux)**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/chiptoe-svg/canvas-cli/release/audited/install.sh | sh
    ```
    The installer checks the archive against `checksums.txt`. To also verify the
    Sigstore signature on `checksums.txt` (requires `cosign`):
    ```bash
    cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp '^https://github.com/chiptoe-svg/canvas-cli/\.github/workflows/release\.yml@refs/tags/v' \
      checksums.txt
    ```
    Builds are reproducible: check out this tag, then
    `CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version={{.Version}} -X main.Commit={{.FullCommit}} -X main.BuildDate={{.CommitDate}}" ./cmd/canvas`
    with the Go version in `go.mod` produces the same bytes as the archive here.
  extra_files:
    - glob: ./install.sh
