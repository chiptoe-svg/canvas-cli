# Release — builds, signs and publishes the binaries faculty install.
#
# This pipeline is deliberately self-contained and pinned: every action is
# referenced by commit SHA (the version is in the trailing comment), and no
# reusable workflow from another repository is involved. That is what makes
# the Sigstore signature meaningful — the signer identity on checksums.txt is
# this file, in this repository, at the tagged ref. Change the recipe here, in
# a reviewed commit, or the signature no longer describes what was built.
#
# Bumping a pinned action: resolve the new tag to its commit SHA
# (gh api repos/<owner>/<repo>/git/ref/tags/<tag>) and update both the SHA
# and the comment.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload assets
  id-token: write # keyless cosign signing via OIDC

jobs:
  release:
    # Release only from clean tags; skip pre-release-style tags (v1.2.3-rc1).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
